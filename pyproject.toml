[project]
name = "3gpp-crawler"
version = "2026.11.12"
description = "Crawl 3GPP FTP server, cache all(!) 3GPP document data, return structured JSON/YAML for each document - all via CLI."
authors = [{ name = "Jan Reimes", email = "jan.reimes@head-acoustics.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.13,<3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "beautifulsoup4>=4.15.0",
    "brotli>=1.2.1",
    # "doc2txt>=1.0.8",
    "hishel>=2.0.0",
    "packaging>=26.3",
    "pathspec>=1.1.1",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-calamine>=0.9.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.29.0",
    "xlsxwriter>=3.3.1",
    "unzip-http>=0.9",
    "pool-executors",
    "oxyde>=0.8.0",
    "ison-py>=1.2.0",
    "toon-format>=1.2.0",
    "pydantic-settings>=2.16.2",
    "niquests>=3.21.3",
    "fastmcp>=4.1.7",
]

[project.urls]
Repository = "https://github.com/jr2804/3gpp-crawler"


[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "deptry>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=1.2.0",
    "pydeps>=3.0.2",
    "zensical>=0.0.26",
    "mkdocstrings[python]>=0.26.1",
    "markdown-exec>=1.8",
    "markdown-callouts>=0.4",
    "ghp-import>=2.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings-python>=2.0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
tdoc-crawler = "tdoc_crawler.cli.tdoc_app:tdoc_app"
spec-crawler = "tdoc_crawler.cli.spec_app:spec_app"
3gpp-crawler = "tdoc_crawler.cli.mgmt_app:mgmt_app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"
# Register custom pytest marks
markers = [
    "integration: marks tests as integration tests (slower, requires network)",
]

[tool.pytest-cov]
addopts = "--cov=tdoc_crawler --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 70

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"


[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/tdoc_crawler"]

bump = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pool-executors = { workspace = true }
toon-format = { git = "https://github.com/toon-format/toon-python.git" }
doc2txt = { git = "https://github.com/Quantatirsk/doc2txt-pypi.git" }

