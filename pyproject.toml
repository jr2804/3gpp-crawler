[project]
name = "3gpp-crawler"
version = "2026.11.4"
description = "Crawl 3GPP FTP server, cache all(!) 3GPP document data, return structured JSON/YAML for each document - all via CLI."
authors = [{ name = "Jan Reimes", email = "jan.reimes@head-acoustics.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.13,<3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "beautifulsoup4>=4.14.2",
    "brotli>=1.2.0",
    "convert-lo",
    # "doc2txt>=1.0.8",
    "hishel>=1.1.8",
    "packaging>=24.0",
    "pathspec>=0.12",
    "pandas>=3.0.0",
    "pydantic>=2.12.2",
    "python-calamine>=0.5.3",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "typer>=0.19.2",
    "xlsxwriter>=3.2.9",
    "unzip-http>=0.7",
    "pool-executors",
    "oxyde>=0.4.0",
    "ison-py>=1.0.2",
    "toon-format",
    "pydantic-settings>=2.13.1",
    "niquests>=3.18.4",
    "pdf-remote-converter",
    "fastmcp>=3.4.7",
]

[project.urls]
Repository = "https://github.com/jr2804/3gpp-crawler"


[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "deptry>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=1.2.0",
    "pydeps>=3.0.2",
    "zensical>=0.0.26",
    "mkdocstrings[python]>=0.26.1",
    "markdown-exec>=1.8",
    "markdown-callouts>=0.4",
    "ghp-import>=2.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings-python>=2.0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
tdoc-crawler = "tdoc_crawler.cli.tdoc_app:tdoc_app"
spec-crawler = "tdoc_crawler.cli.spec_app:spec_app"
3gpp-crawler = "tdoc_crawler.cli.mgmt_app:mgmt_app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"
# Register custom pytest marks
markers = [
    "integration: marks tests as integration tests (slower, requires network)",
]

[tool.pytest-cov]
addopts = "--cov=tdoc_crawler --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 70

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"


[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.undersort]
# Method visibility ordering: public (no underscore), protected (single underscore), private (double underscore)
# Customize the order by specifying: "public", "protected", "private"
order = ["public", "protected", "private"]

# Method type ordering within each visibility level (optional)
# Options: "class" (classmethod), "static" (staticmethod), "instance" (regular methods)
# Default order if not specified: ["instance", "class", "static"]
method_type_order = ["instance", "class", "static"]

# Exclude files/directories matching these patterns (optional)
# Patterns support glob syntax (e.g. "tests/*", "migrations/*.py", "**/generated/*")
# exclude = ["tests/*", "migrations/*.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/tdoc_crawler"]

bump = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
convert-lo = { workspace = true }
pool-executors = { workspace = true }
toon-format = { git = "https://github.com/toon-format/toon-python.git" }
doc2txt = { git = "https://github.com/Quantatirsk/doc2txt-pypi.git" }
pdf-remote-converter = { git = "https://forge.3gpp.org/rep/reimes/pdf-remote-converter" }
