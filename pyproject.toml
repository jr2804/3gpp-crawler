[project]
name = "3gpp-crawler"
dynamic = ["version"]
description = "Crawl 3GPP FTP server, cache all(!) 3GPP document data, return structured JSON/YAML for each document - all via CLI."
authors = [{ name = "Jan Reimes", email = "jan.reimes@head-acoustics.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.14,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "aiointerpreters>=0.4.0",
    "beautifulsoup4>=4.14.2",
    "brotli>=1.2.0",
    "convert-lo",
    "doc2txt>=1.0.8",
    "hishel>=1.1.8",
    "liteparse>=1.2.0",
    "opendataloader-pdf[hybrid]>=2.2.0",
    "packaging>=25.0",
    "pandas>=3.0.0",
    "pydantic>=2.12.2",
    "python-calamine>=0.5.3",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "typer>=0.19.2",
    "xlsxwriter>=3.2.9",
    "zipinspect>=0.1.2",
    "lxml>=6.0.2",
    "pool-executors",
    "oxyde>=0.4.0",
    "ison-py>=1.0.2",
    "isonantic>=1.0.1",
    "toon-format",
    "pydantic-settings>=2.13.1",
    "niquests>=3.18.4",
    "aioquic>=1.3.0",
]

[project.urls]
Repository = "https://forge.3gpp.org/rep/reimes/3gpp-crawler"


[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "deptry>=0.23.0",
    "pytest-cov>=4.0.0",
    "mkdocs>=1.4.2",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=0.26.1",
    "pytest-asyncio>=1.2.0",
    "pydeps>=3.0.2",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project.scripts]
tdoc-crawler = "tdoc_crawler.cli.tdoc_app:tdoc_app"
spec-crawler = "tdoc_crawler.cli.spec_app:spec_app"
3gpp-crawler = "tdoc_crawler.cli.mgmt_app:mgmt_app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Register custom pytest marks
markers = [
    "integration: marks tests as integration tests (slower, requires network)",
]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.undersort]
# Method visibility ordering: public (no underscore), protected (single underscore), private (double underscore)
# Customize the order by specifying: "public", "protected", "private"
order = ["public", "protected", "private"]

# Method type ordering within each visibility level (optional)
# Options: "class" (classmethod), "static" (staticmethod), "instance" (regular methods)
# Default order if not specified: ["instance", "class", "static"]
method_type_order = ["instance", "class", "static"]

# Exclude files/directories matching these patterns (optional)
# Patterns support glob syntax (e.g. "tests/*", "migrations/*.py", "**/generated/*")
# exclude = ["tests/*", "migrations/*.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/tdoc_crawler"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
convert-lo = { workspace = true }
pool-executors = { workspace = true }
toon-format = { git = "https://github.com/toon-format/toon-python.git" }
doc2txt = { git = "https://github.com/Quantatirsk/doc2txt-pypi.git" }
