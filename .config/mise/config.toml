[tools]
"aqua:steveyegge/beads" = "latest"
"github:yoanbernabeu/grepai" = "latest"
node = "latest"
bun = "latest"

[settings.npm]
package_manager = "bun"

[tasks.default]
run = "mise tasks"

[tasks.upgrade-tools]
description = "Upgrade all development tools to their latest versions"
run = "mise up"

[tasks.env-sync]
description = "Sync the virtual environment with pyproject.toml dependencies"
run = "uv sync -U --dev --all-extras --all-groups"

[tasks.format]
description = "Format source code and tests"
run = [
    "uv run undersort src/ tests/ --exclude .config/",
    "ruff check --select I --fix", # isort-equivalent sorting of imports
    "ruff format src/ tests/ --exclude .config",
]

[tasks.format-md]
description = "Format Markdown files"
run = "mdformat src/ docs/ tests/ .specify/ specs/ --exclude .config/"

[tasks.lint]
description = "Lint source code and tests"
run = "ruff check src tests"

[tasks.lint-fix]
description = "Lint source code and tests and fix simple issues"
run = "ruff check --fix src tests"

[tasks.lint-fix-unsafe]
description = "Lint source code and tests and fix simple issues"
run = "ruff check --fix --unsafe-fixes src tests"

[tasks.type-check]
description = "Type check source code and tests"
run = "ty check src/ tests/"

[tasks.test]
description = "Run all tests with verbose output and short tracebacks"
run = "uv run pytest tests/ -v --tb=short"

[tasks.test-coverage]
description = "Run all tests with coverage report"
run = "uv run pytest tests/ -v --cov=src/tdoc_crawler --cov-report=html"

[tasks.spec-init]
description = "Initialize Github Spec Kit in the current directory"
usage = '''
arg "<ai_agent>" help="AI assistant to use: claude, gemini, copilot, cursor-agent, qwen, opencode, codex, windsurf, kilocode, auggie, roo, codebuddy, amp, shai, q, bob, or qoder"
arg "[script]" help="Script variant to use: sh (bash/zsh) or ps (PowerShell)" default="ps"
'''
run = ["cls", "uv run specify init --here --ai {{usage.ai_agent}} --script {{usage.script}}", "uv run specify check"]

[tasks.add-mcp-servers]
usage = '''
arg "<ai_agent>" help="AI assistant to use: claude, gemini, copilot, opencode, ... see: https://github.com/neondatabase/add-mcp"
'''
shell = "pwsh -NoProfile -Command"
run = 'bun x add-mcp  -y -a {{usage.ai_agent}} "grepai mcp-serve"'

[tasks.add-skills]
run = [
    "@echo off",
    "cls",
    "bun x skills add https://github.com/nicobailon/visual-explainer -a universal -y",
    "bun x skills add https://github.com/alinaqi/claude-bootstrap -s code-deduplication -a universal -y",
    "bun x skills add https://github.com/hardikpandya/stop-slop -a universal -y",
    "bun x skills add kreuzberg-dev/kreuzberg -a universal -y"
]
