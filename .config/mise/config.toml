[tasks.default]
run = "mise tasks"

[tasks.format]
run = [
    "undersort src/ tests/ --exclude .config/",
    "isort src/ tests/",
    "ruff format src/ tests/ --exclude .config",
    "mdformat src/ docs/ tests/ --exclude .config/",
]

[tasks.lint]
run = "ruff check src tests"

[tasks.lint-fix]
run = "ruff check --fix src tests"

[tasks.type-check]
run = "ty src/ tests/"

[tasks.test]
run = "uv run pytest tests/ -v"

[tasks.test-coverage]
run = "uv run pytest tests/ -v --cov=src/tdoc_crawler --cov-report=html"

[tasks.spec-init]
description = "Initialize Github Spec Kit in the current directory"
usage = '''
arg "<ai_agent>" help="AI assistant to use: claude, gemini, copilot, cursor-agent, qwen, opencode, codex, windsurf, kilocode, auggie, roo, codebuddy, amp, shai, q, bob, or qoder"
arg "[script]" help="Script variant to use: sh (bash/zsh) or ps (PowerShell)" default="ps"
'''
run = ["cls", "uv run specify init --here --ai {{usage.ai_agent}} --script {{usage.script}}", "uv run specify check"]

[tasks.convert-mcp-cfg]
run = ["cls",
    "uvx --from https://github.com/jr2804/mcp-config-converter.git mcp-config-converter convert .vscode/mcp.json --provider{% if args %} {{ args }}{% endif %}"
]

[tasks.beads-up]
description = "Installs beads (bd.exe) to virtual environment's scripts directory"
run = ["bin install https://github.com/steveyegge/beads {{env.VIRTUAL_ENV}}/scripts/"]