# mise configuration
# Task definitions are in conf.d/*.toml files (automatically loaded by mise)

[tools]
# basic frameworks that should always be available
#node = "latest"
bun = "latest"

# CLIs to access Github/3GPP Forge
"gitlab:gitlab-org/cli" = "latest"
"github:cli/cli" = "latest"

# Linter/formatter/type checker tools
"ruff" = "latest"
"ty" = "latest"
"rumdl" = "latest"
"pypi:codespell" = "latest"
"pypi:pyreorder" = "latest"

# CLI tools rg and tree-cli -> use `rg --files | tree-cli --fromfile` to get a nice tree view of the project files
ripgrep = "latest"
"github:peteretelej/tree" = { version = "latest", rename_exe = "tree-cli" }

# AI/dev tools
"github:gastownhall/beads" = "latest"
"pypi:beads-mcp" = "latest"

"github:microsoft/coreutils" = "latest"
#"github:arabold/docs-mcp-server" = "latest"

[env]
GITLAB_HOST = "forge.3gpp.org"

[settings.npm]
package_manager = "bun"

[settings.pypi]
uvx = true
