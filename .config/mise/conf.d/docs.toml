# Documentation tasks.
# zensical is the default builder now that uv's symlink link-mode crash is
# fixed via --link-mode=copy. The GitHub Pages workflow (docs.yml) still
# deploys mkdocs - mkdocs tasks are kept until the Pages pipeline migrates.

[tasks.docs]
description = "Build documentation"
# --link-mode=copy: zensical's file watcher panics under uv's symlink link
# mode (UV_LINK_MODE=symlink); copy links keep the build deterministic.
run = ["uv run --link-mode=copy zensical build"]

[tasks."docs:mkdocs"]
description = "Build documentation (mkdocs; used by the Pages workflow)"
run = ["uv run mkdocs build --strict"]

[tasks."docs:serve"]
description = "Live-reload docs preview (mkdocs)"
run = ["uv run mkdocs serve"]
