site_name: tdoc-crawler
repo_url: https://github.com/Jan-Reimes_HEAD/tdoc-crawler
site_url: https://Jan-Reimes_HEAD.github.io/tdoc-crawler
site_description: Crawl 3GPP FTP server, cache all(!) TDocs data, return structured JSON/YAML for each TDoc - all via CLI.
site_author: Jan Reimes
edit_uri: edit/main/docs/
repo_name: Jan-Reimes_HEAD/tdoc-crawler
copyright: Maintained by <a href="https://Jan-Reimes_HEAD.com">Jan-Reimes_HEAD</a>.

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src/tdoc_crawler"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Jan-Reimes_HEAD/tdoc-crawler
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/tdoc-crawler

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
