name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      new: ${{ steps.tag.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - id: tag
        run: |
          tag="v$(uv version --short)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Draft release notes with LLM
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ vars.LLM_API_BASE }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          TAG: ${{ needs.version.outputs.tag }}
        run: python3 scripts/release_notes.py --tag "$TAG" --output release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ -s release-notes.md ]; then
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: [version, release]
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/3gpp-crawler/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mirror:
    needs: [version, release]
    if: always() && needs.version.result != 'failure' && needs.release.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push main and tags to forge.3gpp.org
        env:
          FORGE_MIRROR_TOKEN: ${{ secrets.FORGE_MIRROR_TOKEN }}
        run: |
          git remote add forge "https://oauth2:${FORGE_MIRROR_TOKEN}@forge.3gpp.org/rep/reimes/3gpp-crawler.git"
          git push forge "HEAD:refs/heads/main"
          existing="$(git ls-remote --tags forge | sed -n 's#.*refs/tags/\([^^]*\)$#\1#p' | sort -u)"
          for tag in $(git tag --list); do
            grep -qx "${tag}" <<< "${existing}" || git push forge "refs/tags/${tag}:refs/tags/${tag}"
          done
