---
# GitLab CI/CD for 3gpp-crawler
#
# Runs on push to main: builds wheel, creates release with CalVer version.
# Requires CI_RELEASE_TOKEN: a project access token with developer+ role,
# set in Settings > CI/CD > Variables on forge.3gpp.org.

image: python:3.13-slim

stages:
  - build
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cache/pip
    - .cache/uv

before_script:
  - pip install uv
  - uv sync --frozen

build-wheel:
  stage: build
  script:
    - uv build --wheel
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

release:
  stage: release
  needs: [build-wheel]
  script:
    - bash scripts/ci-release.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
