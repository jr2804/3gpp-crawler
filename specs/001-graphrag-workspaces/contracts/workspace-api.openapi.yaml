openapi: 3.1.0
info:
  title: GraphRAG Workspace API Contract
  version: 0.1.0
  description: Workspace/project scoping logical contract for AI GraphRAG pipeline JSON payloads.
x-contract-mode: logical-non-http
x-contract-frozen-at-foundation: true
servers:
  - url: /
paths:
  /ai/workspaces:
    get:
      summary: List workspaces
      responses:
        "200":
          description: Workspace list
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
    post:
      summary: Create workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace:
                  type: string
              required: [workspace]
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"

  /ai/workspaces/{workspace}/members:
    get:
      summary: List workspace members
      parameters:
        - $ref: "#/components/parameters/workspace"
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    type: string
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceMember"
    post:
      summary: Add members to workspace
      parameters:
        - $ref: "#/components/parameters/workspace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                members:
                  type: array
                  items:
                    $ref: "#/components/schemas/WorkspaceMemberInput"
              required: [members]
      responses:
        "200":
          description: Members registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    type: string
                  added_count:
                    type: integer

  /ai/process:
    post:
      summary: Process workspace corpus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace:
                  type: string
                  description: Optional; defaults to "default" when omitted or blank.
                new_only:
                  type: boolean
                  default: false
                force:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Processing results
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    type: string
                  processed:
                    type: integer
                  skipped:
                    type: integer

  /ai/status:
    get:
      summary: Get workspace-scoped status
      parameters:
        - name: workspace
          in: query
          required: false
          schema:
            type: string
          description: Optional workspace; defaults to "default".
      responses:
        "200":
          description: Status list
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    type: string
                  statuses:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProcessingStatus"

components:
  parameters:
    workspace:
      name: workspace
      in: path
      required: true
      schema:
        type: string
      description: Workspace name. Caller may pass "default" explicitly.

  schemas:
    Workspace:
      type: object
      required: [workspace, is_default, created_at, updated_at]
      properties:
        workspace:
          type: string
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WorkspaceMemberInput:
      type: object
      required: [source_item_id, source_path, source_kind]
      properties:
        source_item_id:
          type: string
        source_path:
          type: string
        source_kind:
          type: string
          enum: [tdoc, spec, other]

    WorkspaceMember:
      allOf:
        - $ref: "#/components/schemas/WorkspaceMemberInput"
        - type: object
          required: [workspace, added_at, is_active]
          properties:
            workspace:
              type: string
            added_at:
              type: string
              format: date-time
            is_active:
              type: boolean

    ProcessingStatus:
      type: object
      required: [workspace, source_item_id, current_stage]
      properties:
        workspace:
          type: string
        source_item_id:
          type: string
        current_stage:
          type: string
        completed_at:
          type: string
          format: date-time
          nullable: true
        error_message:
          type: string
          nullable: true
